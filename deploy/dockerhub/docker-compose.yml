# splime daemon - run the published Docker Hub image with safe defaults.
#
# Does NOT mount the host Docker socket. Publishes on 127.0.0.1 only. Call the
# HTTP API with the bearer token written to <home>/daemon-endpoint.json.
#
#   docker compose up -d
#   docker compose logs -f
name: spl-daemon

services:
  spl-daemon:
    image: yastrebovks/spl-daemon:0.4.6
    container_name: spl-daemon
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPL_DAEMON_HOME: ${SPL_DAEMON_HOME:-/var/lib/spl-daemon}
      HOME: ${SPL_DAEMON_HOME:-/var/lib/spl-daemon}
      SPL_DAEMON_SECRET_BACKEND: file

    # Local-first: the API requires the daemon-endpoint.json bearer token.
    # Publish on host loopback only - never 0.0.0.0 or a public interface.
    ports:
      - "127.0.0.1:8765:8765"

    volumes:
      # Daemon home. Keep the path identical on host and in the container so
      # docker-runtime nodes (if you later opt in to DooD) resolve per-run
      # bind paths. Make it writable by UID/GID 10001 first:
      #   sudo mkdir -p /var/lib/spl-daemon && sudo chown 10001:10001 /var/lib/spl-daemon
      - ${SPL_DAEMON_HOME:-/var/lib/spl-daemon}:${SPL_DAEMON_HOME:-/var/lib/spl-daemon}
