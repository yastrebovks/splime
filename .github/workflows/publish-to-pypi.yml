name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Exact signed SPLime source tag to build"
        required: true
        type: string
      release-scope:
        description: "SDK first; coordinated verification after the server dependency lock and tags are ready"
        required: true
        type: choice
        default: sdk
        options: [sdk, coordinated]
      cookbook-url:
        description: "Reviewed cookbook HTTPS URL (required for coordinated mode only)"
        required: false
        type: string
      cookbook-sha256:
        description: "Reviewed cookbook SHA-256 (required for coordinated mode only)"
        required: false
        type: string
      target:
        description: "Verify only, or select the package index to publish to"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - testpypi
          - pypi

# Keep publishing jobs here: PyPI trusts this existing workflow filename.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release-tag }}
  PUBLIC_COOKBOOK_URL: ${{ inputs.cookbook-url }}
  PUBLIC_COOKBOOK_SHA256: ${{ inputs.cookbook-sha256 }}

jobs:
  build-sdk:
    if: inputs.release-scope == 'sdk'
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: sdk-source
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate SDK declaration and verify the signed source tag
        id: source
        working-directory: sdk-source
        env:
          SPL_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.SPL_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          contract = json.loads(Path('release-contract.json').read_text())
          requested = os.environ['RELEASE_TAG']
          package = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', requested) is None:
              raise SystemExit('invalid SDK tag')
          if requested != contract['source_tag'] or requested != 'v' + contract['version']:
              raise SystemExit('signed SDK tag must match the release declaration')
          if package['name'] != 'splime' or package['version'] != contract['version']:
              raise SystemExit('SDK package metadata must match the release declaration')
          PY
          test -n "${SPL_RELEASE_SIGNING_PUBLIC_KEY}"
          printf '%s' "${SPL_RELEASE_SIGNING_PUBLIC_KEY}" | gpg --batch --import
          git verify-tag "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Install deterministic SDK build tools
        run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - name: Build SDK wheel and sdist twice
        working-directory: sdk-source
        run: |
          python tools/build_release_artifacts.py --out-dir ../artifacts/python
          python tools/build_release_artifacts.py --out-dir ../reproducibility/python
          python -m twine check ../artifacts/python/*
      - name: Verify reproducibility and record SDK-only evidence
        env:
          SDK_COMMIT: ${{ steps.source.outputs.commit }}
          SDK_VERSION: ${{ steps.source.outputs.version }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os
          from pathlib import Path
          version = os.environ['SDK_VERSION']
          expected = {f'splime-{version}-py3-none-any.whl', f'splime-{version}.tar.gz'}
          def digests(root):
              paths = list(root.iterdir())
              if {p.name for p in paths} != expected or not all(p.is_file() for p in paths):
                  raise SystemExit('SDK artifact allowlist requires exactly its wheel and sdist')
              return {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          first = digests(Path('artifacts/python'))
          if first != digests(Path('reproducibility/python')):
              raise SystemExit('SDK artifacts are not reproducible')
          evidence = {
              'schema_version': 1, 'evidence_scope': 'sdk_only',
              'version': version, 'release_id': f'splime-{version}',
              'source_tag': os.environ['RELEASE_TAG'], 'source_commit': os.environ['SDK_COMMIT'],
              'source_date_epoch': int(os.environ['SOURCE_DATE_EPOCH']),
              'observed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'artifacts': first,
          }
          Path('artifacts/sdk-build-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Upload only the public SDK package and its evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-sdk-artifacts
          path: |
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
            artifacts/sdk-build-evidence.json
          if-no-files-found: error
          retention-days: 14

  sdk-install-test:
    needs: build-sdk
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dependencies:
          - {numpy: "2.3.5", pandas: "2.2.3"}
          - {numpy: "2.5.4", pandas: "3.0.6"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: sdk-source
          ref: ${{ needs.build-sdk.outputs.source-commit }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-sdk-artifacts
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify the exact SDK bytes and install the wheel
        env:
          SDK_COMMIT: ${{ needs.build-sdk.outputs.source-commit }}
          SDK_VERSION: ${{ needs.build-sdk.outputs.version }}
          NUMPY_VERSION: ${{ matrix.dependencies.numpy }}
          PANDAS_VERSION: ${{ matrix.dependencies.pandas }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path('artifacts')
          evidence = json.loads((root / 'sdk-build-evidence.json').read_text())
          if (evidence['evidence_scope'], evidence['source_commit'], evidence['version']) != ('sdk_only', os.environ['SDK_COMMIT'], os.environ['SDK_VERSION']):
              raise SystemExit('SDK evidence identity mismatch')
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (root / 'python').iterdir() if p.is_file()}
          version = evidence['version']
          if set(actual) != {f'splime-{version}-py3-none-any.whl', f'splime-{version}.tar.gz'} or actual != evidence['artifacts']:
              raise SystemExit('SDK artifact allowlist or digest mismatch')
          wheel = root / 'python' / f'splime-{version}-py3-none-any.whl'
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel), 'pytest==9.1.1', 'pytest-asyncio', 'numpy==' + os.environ['NUMPY_VERSION'], 'pandas==' + os.environ['PANDAS_VERSION']], check=True)
          subprocess.run([sys.executable, '-I', '-c', f"from importlib.metadata import version; import spl; assert version('splime') == {version!r}; assert 'site-packages' in spl.__file__"], check=True)
          PY
      - name: Run portable execution and sync response tests outside the checkout
        run: python sdk-source/integration_tests/installed_contract.py

  publish-sdk:
    needs: [build-sdk, sdk-install-test]
    if: inputs.release-scope == 'sdk' && inputs.target != 'verify'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/project/splime/' || 'https://test.pypi.org/project/splime/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-sdk-artifacts
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reverify SDK evidence and package allowlist before publication
        env:
          SDK_COMMIT: ${{ needs.build-sdk.outputs.source-commit }}
          SDK_VERSION: ${{ needs.build-sdk.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts')
          evidence = json.loads((root / 'sdk-build-evidence.json').read_text())
          if (evidence['evidence_scope'], evidence['source_commit'], evidence['version']) != ('sdk_only', os.environ['SDK_COMMIT'], os.environ['SDK_VERSION']):
              raise SystemExit('SDK evidence identity mismatch')
          version = evidence['version']
          paths = list((root / 'python').iterdir())
          if {p.name for p in paths} != {f'splime-{version}-py3-none-any.whl', f'splime-{version}.tar.gz'} or not all(p.is_file() for p in paths):
              raise SystemExit('SDK publication artifact allowlist mismatch')
          if {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in paths} != evidence['artifacts']:
              raise SystemExit('SDK publication digest mismatch')
          PY
      - name: Publish exact SDK packages with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: artifacts/python/
      - name: Observe exact SDK index bytes for the server-lock handoff
        env:
          INDEX: ${{ inputs.target }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          root = Path('artifacts')
          evidence = json.loads((root / 'sdk-build-evidence.json').read_text())
          host = 'pypi.org' if os.environ['INDEX'] == 'pypi' else 'test.pypi.org'
          metadata_url = f"https://{host}/pypi/splime/{evidence['version']}/json"
          expected = evidence['artifacts']
          observed = None
          for attempt in range(12):
              try:
                  with urlopen(Request(metadata_url, headers={'User-Agent': 'splime-sdk-release/1'}), timeout=30) as response:
                      items = {item['filename']: item for item in json.loads(response.read()).get('urls', [])}
                  if set(items) == set(expected) and all(items[n].get('digests', {}).get('sha256') == h for n, h in expected.items()):
                      observed = items
                      break
              except Exception:
                  pass
              if attempt != 11:
                  time.sleep(5)
          if observed is None:
              raise SystemExit('index filename/digest set does not match the verified SDK')
          artifacts = []
          artifact_host = 'files.pythonhosted.org' if os.environ['INDEX'] == 'pypi' else 'test-files.pythonhosted.org'
          for name in sorted(expected):
              url = observed[name]['url']
              parsed = urlparse(url)
              if parsed.scheme != 'https' or parsed.hostname != artifact_host or parsed.username or parsed.password or parsed.fragment or Path(parsed.path).name != name:
                  raise SystemExit('unsafe SDK artifact download URL')
              with urlopen(Request(url, headers={'User-Agent': 'splime-sdk-release/1'}), timeout=30) as response:
                  payload = response.read()
              if hashlib.sha256(payload).hexdigest() != expected[name]:
                  raise SystemExit('downloaded index bytes differ from verified SDK')
              artifacts.append({'filename': name, 'url': url, 'sha256': expected[name]})
          handoff = {'schema_version': 1, 'evidence_scope': 'sdk_only', 'release_id': evidence['release_id'], 'index': os.environ['INDEX'], 'metadata_url': metadata_url, 'source_commit': evidence['source_commit'], 'observed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'), 'artifacts': artifacts}
          (root / 'pypi-publication-evidence.json').write_text(json.dumps(handoff, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-index-publication-evidence
          path: artifacts/pypi-publication-evidence.json
          if-no-files-found: error
          retention-days: 14

  source-chain:
    if: inputs.release-scope == 'coordinated'
    name: Materialize external source evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact framework/daemon source tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: release-workspace/spl
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Import the trusted release-signing public key
        env:
          SPL_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.SPL_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${SPL_RELEASE_SIGNING_PUBLIC_KEY}"
          printf '%s' "${SPL_RELEASE_SIGNING_PUBLIC_KEY}" | gpg --batch --import
          git -C release-workspace/spl verify-tag "${RELEASE_TAG}"

      - name: Configure authenticated GitLab source trust
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SPL_RELEASE_GITLAB_SSH_KEY }}

      - name: Install the pinned GitLab host keys
        env:
          SPL_RELEASE_GITLAB_KNOWN_HOSTS: ${{ secrets.SPL_RELEASE_GITLAB_KNOWN_HOSTS }}
        run: |
          test -n "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"

      - name: Validate the requested release tag against the tracked declaration
        working-directory: release-workspace/spl
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("release-contract.json").read_text(encoding="utf-8"))
          requested = os.environ["RELEASE_TAG"]
          if contract["source_tag"] != requested or requested != f"v{contract['version']}":
              raise SystemExit(
                  f"requested tag {requested!r} does not match the release contract "
                  f"{contract['source_tag']!r}"
              )
          PY

      - name: Check out pinned server and Console sources
        run: |
          SERVER_REF="$(python -c 'import json; print(json.load(open("release-workspace/spl/release-contract.json"))["components"]["server"]["source_ref"])')"
          CONSOLE_REF="$(python -c 'import json; print(json.load(open("release-workspace/spl/release-contract.json"))["components"]["console"]["source_ref"])')"
          git clone --branch "${SERVER_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-server.git release-workspace/spl-server
          git clone --branch "${CONSOLE_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-frontend.git release-workspace/spl-frontend

      - name: Generate and verify external source evidence
        working-directory: release-workspace/spl
        run: |
          OBSERVED_AT="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          python -m tools.generate_release_identity \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" --check
          python -m tools.release_chain \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --manifest "${GITHUB_WORKSPACE}/release-workspace/spl/release-manifest.json" \
            --emit-source-evidence \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/source-release-manifest.json" \
            --observed-at "${OBSERVED_AT}"
          python -m tools.release_chain \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --manifest \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/source-release-manifest.json" \
            --stage source
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../spl-server status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../spl-frontend status --porcelain=v1 --untracked-files=all)"

      - name: Upload external source evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-source-evidence
          path: release-workspace/artifacts/source-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  test:
    if: inputs.release-scope == 'coordinated'
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure authenticated GitLab source trust
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SPL_RELEASE_GITLAB_SSH_KEY }}

      - name: Install the pinned GitLab host keys
        env:
          SPL_RELEASE_GITLAB_KNOWN_HOSTS: ${{ secrets.SPL_RELEASE_GITLAB_KNOWN_HOSTS }}
        run: |
          test -n "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"

      - name: Materialize the cross-repository test workspace
        run: |
          SERVER_REF="$(python -c 'import json; print(json.load(open("release-contract.json"))["components"]["server"]["source_ref"])')"
          CONSOLE_REF="$(python -c 'import json; print(json.load(open("release-contract.json"))["components"]["console"]["source_ref"])')"
          git clone --no-hardlinks --branch "${RELEASE_TAG}" . ../spl
          git clone --branch "${SERVER_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-server.git ../spl-server
          git clone --branch "${CONSOLE_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-frontend.git ../spl-frontend
          test -z "$(git -C ../spl status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../spl-server status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../spl-frontend status --porcelain=v1 --untracked-files=all)"

      - name: Fetch and verify the reviewed canonical public cookbook
        run: |
          test -n "${PUBLIC_COOKBOOK_URL}"
          test -n "${PUBLIC_COOKBOOK_SHA256}"
          case "${PUBLIC_COOKBOOK_URL}" in
            https://*) ;;
            *) echo "public cookbook URL must use HTTPS" >&2; exit 1 ;;
          esac
          printf '%s' "${PUBLIC_COOKBOOK_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
          curl --fail --location \
            --proto '=https' --proto-redir '=https' \
            --output "${RUNNER_TEMP}/splime-cookbook.ipynb" \
            "${PUBLIC_COOKBOOK_URL}"
          printf '%s  %s\n' \
            "${PUBLIC_COOKBOOK_SHA256}" \
            "${RUNNER_TEMP}/splime-cookbook.ipynb" \
            | sha256sum --check --strict -
          echo "SPL_RELEASE_COOKBOOK_PATH=${RUNNER_TEMP}/splime-cookbook.ipynb" \
            >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Materialize reviewed public landing fixtures for Console tests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import urlopen
          fixtures = [
              ('index.html', 'https://splime.io/', '091b6478a95cc7271680f2ca29b02fe4bb864a653fca4145aea1aec08abbaeda'),
              ('privacy.html', 'https://splime.io/privacy', '661dde6610aa14cb9166a1a00555c5ea585e0c83802e0862e33c87675503dd47'),
              ('terms.html', 'https://splime.io/terms', '5bbc83df97a4326a2e7eab0cbd1cef2ee4324c78465bab7a2441968c8d3ab789'),
          ]
          verified = {}
          for name, url, expected in fixtures:
              with urlopen(url, timeout=30) as response:
                  final = urlparse(response.geturl())
                  if final.scheme != 'https' or final.hostname != 'splime.io':
                      raise SystemExit('unexpected public landing fixture redirect')
                  payload = response.read(2 * 1024 * 1024 + 1)
              if hashlib.sha256(payload).hexdigest() != expected:
                  raise SystemExit('public landing fixture hash mismatch: ' + name)
              verified[name] = payload
          root = Path('../swpl-landing')
          root.mkdir(parents=True, exist_ok=True)
          for name, payload in verified.items():
              (root / name).write_bytes(payload)
          print('Verified public landing fixtures for Console integration tests.')
          PY

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Correct only the test fixture for this already-signed source tag. The
      # source-chain and build jobs continue to use the unchanged signed tree.
      - name: Apply the reviewed v0.4.12 FileInput test correction
        if: inputs.release-tag == 'v0.4.12'
        env:
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags origin "${RELEASE_WORKFLOW_SHA}"
          git show "${RELEASE_WORKFLOW_SHA}:.github/release-test-fixes/v0.4.12-file-input.patch" \
            > "${RUNNER_TEMP}/v0.4.12-file-input.patch"
          printf '%s  %s\n' \
            '02ce58be5e6a2545d935b3fa64e7f26ccd09123b2bd0de711e0a2695e677cc53' \
            'tests/core/test_runtime_port_adapters.py' | sha256sum --check --strict -
          git apply --check "${RUNNER_TEMP}/v0.4.12-file-input.patch"
          git apply "${RUNNER_TEMP}/v0.4.12-file-input.patch"
          test "$(git diff --name-only)" = 'tests/core/test_runtime_port_adapters.py'
          git diff --check
          git diff -- tests/core/test_runtime_port_adapters.py

      # The signed package stays unchanged; synchronize only this flaky test fixture.
      - name: Apply the reviewed v0.4.13 retention test correction
        if: inputs.release-tag == 'v0.4.13'
        env:
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags origin "${RELEASE_WORKFLOW_SHA}"
          git show "${RELEASE_WORKFLOW_SHA}:.github/release-test-fixes/v0.4.13-retention.patch" \
            > "${RUNNER_TEMP}/v0.4.13-retention.patch"
          printf '%s  %s\n' \
            'e501554edbc53aeecd627a1f65f0ef6aafd66028c9fed1cf63bf7db9ff0fce1f' \
            'tests/daemon/test_sol_083_retention.py' | sha256sum --check --strict -
          git apply --check "${RUNNER_TEMP}/v0.4.13-retention.patch"
          git apply "${RUNNER_TEMP}/v0.4.13-retention.patch"
          test "$(git diff --name-only)" = 'tests/daemon/test_sol_083_retention.py'
          git diff --check
          git diff -- tests/daemon/test_sol_083_retention.py

      - name: Run Ruff lint
        run: ruff check

      - name: Check Ruff formatting
        run: ruff format --check

      - name: Run mypy
        run: mypy --python-version 3.13 src

      - name: Run unit tests (smoke excluded)
        run: python -m pytest -m "not smoke" -q

      - name: Set up Node for the pinned Console tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run complete Console syntax and regression suite
        working-directory: ../spl-frontend
        run: npm run check

  build:
    name: Build and verify the external release BOM
    needs:
      - source-chain
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact framework/daemon source tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: release-workspace/spl
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download external source evidence
        uses: actions/download-artifact@v4
        with:
          name: release-source-evidence
          path: release-workspace/artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Import the trusted release-signing public key
        env:
          SPL_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.SPL_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${SPL_RELEASE_SIGNING_PUBLIC_KEY}"
          printf '%s' "${SPL_RELEASE_SIGNING_PUBLIC_KEY}" | gpg --batch --import
          git -C release-workspace/spl verify-tag "${RELEASE_TAG}"

      - name: Configure authenticated GitLab source trust
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SPL_RELEASE_GITLAB_SSH_KEY }}

      - name: Install the pinned GitLab host keys
        env:
          SPL_RELEASE_GITLAB_KNOWN_HOSTS: ${{ secrets.SPL_RELEASE_GITLAB_KNOWN_HOSTS }}
        run: |
          test -n "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SPL_RELEASE_GITLAB_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"

      - name: Resolve the externally observed component sources
        id: source
        env:
          SOURCE_MANIFEST: release-workspace/artifacts/source-release-manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          manifest = json.loads(Path(os.environ["SOURCE_MANIFEST"]).read_text(encoding="utf-8"))
          if manifest.get("evidence", {}).get("state") != "source":
              raise SystemExit("downloaded source evidence is not in source state")
          outputs = {}
          for component in ("server", "console"):
              value = manifest["components"][component]
              source_ref = value["source_ref"]
              commit = value["source_commit"]
              if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", source_ref) is None:
                  raise SystemExit(f"unsafe {component} source ref")
              if re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", commit) is None:
                  raise SystemExit(f"unsafe {component} source commit")
              outputs[f"{component}-ref"] = source_ref
              outputs[f"{component}-commit"] = commit
          epoch = manifest["source_date_epoch"]
          if isinstance(epoch, bool) or not isinstance(epoch, int) or epoch <= 0:
              raise SystemExit("source evidence has no valid SOURCE_DATE_EPOCH")
          outputs["source-date-epoch"] = str(epoch)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for name, value in outputs.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Check out the exact pinned server and Console commits
        env:
          CONSOLE_COMMIT: ${{ steps.source.outputs.console-commit }}
          CONSOLE_REF: ${{ steps.source.outputs.console-ref }}
          SERVER_COMMIT: ${{ steps.source.outputs.server-commit }}
          SERVER_REF: ${{ steps.source.outputs.server-ref }}
        run: |
          git clone --branch "${SERVER_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-server.git release-workspace/spl-server
          git -C release-workspace/spl-server checkout --detach "${SERVER_COMMIT}"
          git clone --branch "${CONSOLE_REF}" --depth 1 \
            git@gitlab.com:spl894143/spl-frontend.git release-workspace/spl-frontend
          git -C release-workspace/spl-frontend checkout --detach "${CONSOLE_COMMIT}"

      - name: Reverify source evidence before building
        working-directory: release-workspace/spl
        run: |
          python -m tools.generate_release_identity \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" --check
          python -m tools.release_chain \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --manifest \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/source-release-manifest.json" \
            --stage source

      - name: Install deterministic build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Record one build observation time
        run: echo "RELEASE_BUILT_AT=$(date --utc +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Build framework and daemon artifacts twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source-date-epoch }}
        working-directory: release-workspace/spl
        run: |
          python tools/build_release_artifacts.py \
            --out-dir "${GITHUB_WORKSPACE}/release-workspace/artifacts/python" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python tools/build_release_artifacts.py \
            --out-dir "${GITHUB_WORKSPACE}/release-workspace/artifacts/reproducibility/python" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          workspace = Path.cwd().parent
          first = workspace / "artifacts" / "python"
          second = workspace / "artifacts" / "reproducibility" / "python"
          digests = lambda root: {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.iterdir())
              if path.is_file()
          }
          if digests(first) != digests(second):
              raise SystemExit("framework/daemon artifacts are not reproducible")
          PY
          python -m twine check "${GITHUB_WORKSPACE}"/release-workspace/artifacts/python/*

      - name: Build the pinned server wheel twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source-date-epoch }}
        working-directory: release-workspace/spl-server
        run: |
          python -m build --wheel \
            --outdir "${GITHUB_WORKSPACE}/release-workspace/artifacts/server"
          python -m build --wheel \
            --outdir "${GITHUB_WORKSPACE}/release-workspace/artifacts/reproducibility/server"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          workspace = Path.cwd().parent
          first = workspace / "artifacts" / "server"
          second = workspace / "artifacts" / "reproducibility" / "server"
          digests = lambda root: {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.iterdir())
              if path.is_file()
          }
          if len(digests(first)) != 1 or digests(first) != digests(second):
              raise SystemExit("server wheel is missing or is not reproducible")
          PY
          python -m twine check "${GITHUB_WORKSPACE}"/release-workspace/artifacts/server/*

      - name: Build the deterministic pinned Console artifact twice
        env:
          CONSOLE_COMMIT: ${{ steps.source.outputs.console-commit }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source-date-epoch }}
        working-directory: release-workspace/spl
        run: |
          python -m tools.build_console_artifact \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --frontend-root "${GITHUB_WORKSPACE}/release-workspace/spl-frontend" \
            --contract "${GITHUB_WORKSPACE}/release-workspace/spl/release-contract.json" \
            --output-root "${GITHUB_WORKSPACE}/release-workspace/artifacts" \
            --source-commit "${CONSOLE_COMMIT}" \
            --built-at "${RELEASE_BUILT_AT}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python -m tools.build_console_artifact \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --frontend-root "${GITHUB_WORKSPACE}/release-workspace/spl-frontend" \
            --contract "${GITHUB_WORKSPACE}/release-workspace/spl/release-contract.json" \
            --output-root \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/reproducibility/console" \
            --source-commit "${CONSOLE_COMMIT}" \
            --built-at "${RELEASE_BUILT_AT}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          VERSION="$(python -c 'import json; print(json.load(open("release-contract.json"))["version"])')"
          cmp \
            "${GITHUB_WORKSPACE}/release-workspace/artifacts/splime-console-${VERSION}.tar.gz" \
            "${GITHUB_WORKSPACE}/release-workspace/artifacts/reproducibility/console/splime-console-${VERSION}.tar.gz"
          diff --recursive --brief \
            "${GITHUB_WORKSPACE}/release-workspace/artifacts/console" \
            "${GITHUB_WORKSPACE}/release-workspace/artifacts/reproducibility/console/console"

      - name: Materialize and verify the external built BOM
        working-directory: release-workspace/spl
        run: |
          FRAMEWORK_WHEEL="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("../artifacts/source-release-manifest.json").read_text(encoding="utf-8")
          )
          wheels = [
              artifact["path"]
              for artifact in manifest["python"]["artifacts"]
              if artifact["filename"].endswith(".whl")
          ]
          if len(wheels) != 1:
              raise SystemExit("source manifest must declare exactly one framework wheel")
          print(wheels[0])
          PY
          )"
          SERVER_WHEEL="$(find "${GITHUB_WORKSPACE}/release-workspace/artifacts/server" \
            -maxdepth 1 -type f -name 'spl_server-*-py3-none-any.whl' -print)"
          test -n "${SERVER_WHEEL}"
          test "$(printf '%s\n' "${SERVER_WHEEL}" | wc -l | tr -d ' ')" = "1"
          SERVER_WHEEL="${SERVER_WHEEL#${GITHUB_WORKSPACE}/release-workspace/}"
          VERSION="$(python -c 'import json; print(json.load(open("release-contract.json"))["version"])')"
          CONSOLE_ARCHIVE="artifacts/splime-console-${VERSION}.tar.gz"
          python -m tools.release_chain \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --manifest \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/source-release-manifest.json" \
            --emit-built-evidence \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/release-manifest.json" \
            --component-artifact "framework=${FRAMEWORK_WHEEL}" \
            --component-artifact "daemon=${FRAMEWORK_WHEEL}" \
            --component-artifact "server=${SERVER_WHEEL}" \
            --component-artifact "console=${CONSOLE_ARCHIVE}" \
            --observed-at "${RELEASE_BUILT_AT}"
          python -m tools.release_chain \
            --workspace-root "${GITHUB_WORKSPACE}/release-workspace" \
            --manifest \
              "${GITHUB_WORKSPACE}/release-workspace/artifacts/release-manifest.json" \
            --stage built

      - name: Run real isolated author registry and anonymous consumers
        timeout-minutes: 20
        env:
          CI_ACCEPTANCE_ROOT: ${{ runner.temp }}/splime-release-acceptance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import venv

          workspace = (Path(os.environ["GITHUB_WORKSPACE"]) / "release-workspace").resolve()
          artifacts = workspace / "artifacts"
          manifest = json.loads((artifacts / "release-manifest.json").read_text())
          if manifest.get("evidence", {}).get("state") != "built":
              raise SystemExit("acceptance requires verified built evidence")
          version = manifest["version"]
          wheels = {}
          for component, package in (("framework", "splime"), ("server", "spl_server")):
              declared = manifest["components"][component]["artifact"]
              wheel = workspace / declared["path"]
              if wheel.is_symlink() or not wheel.resolve().is_relative_to(artifacts):
                  raise SystemExit("acceptance wheel must remain inside artifact staging")
              if wheel.name != f"{package}-{version}-py3-none-any.whl" or not wheel.is_file():
                  raise SystemExit("acceptance wheel identity mismatch")
              if hashlib.sha256(wheel.read_bytes()).hexdigest() != declared["sha256"]:
                  raise SystemExit("acceptance wheel checksum mismatch")
              wheels[component] = wheel.resolve()

          scratch = Path(os.environ["CI_ACCEPTANCE_ROOT"]).resolve()
          if scratch.is_relative_to(workspace):
              raise SystemExit("acceptance homes must be outside the checkout")
          scratch.mkdir(parents=True, exist_ok=False)
          outside = scratch / "outside-checkouts"
          outside.mkdir()
          clean_env = {k: v for k, v in os.environ.items() if not k.startswith(("SPL", "PYTHON", "UV_", "PIP_"))}
          clean_env["PIP_CONFIG_FILE"] = os.devnull
          interpreters = {}
          for name, numpy, pandas, server in (
              ("author", "2.3.5", "2.2.3", True),
              ("matching", "2.3.5", "2.2.3", False),
              ("alternate", "2.5.4", "3.0.6", False),
          ):
              environment = scratch / "envs" / name
              venv.EnvBuilder(with_pip=True).create(environment)
              interpreter = environment / "bin" / "python"
              interpreters[name] = interpreter
              home = scratch / "homes" / name
              home.mkdir(parents=True)
              env = {**clean_env, "HOME": str(home)}
              packages = [str(wheels["framework"]), f"numpy=={numpy}", f"pandas=={pandas}"]
              if server:
                  packages.append(str(wheels["server"]))
              subprocess.run([str(interpreter), "-I", "-m", "pip", "install", "--no-cache-dir", *packages], cwd=outside, env=env, check=True)
              subprocess.run([str(interpreter), "-I", "-m", "pip", "check"], cwd=outside, env=env, check=True)
              inspection = (
                  "from importlib.metadata import version; from pathlib import Path; import spl; "
                  f"assert version('splime') == {version!r}; "
                  f"assert version('numpy') == {numpy!r}; assert version('pandas') == {pandas!r}; "
                  "assert 'site-packages' in spl.__file__; "
                  f"assert not Path(spl.__file__).resolve().is_relative_to(Path({str(workspace)!r})); "
              )
              if server:
                  inspection += (
                      "import daemon_server; assert 'site-packages' in daemon_server.__file__; "
                      f"assert version('spl-server') == {version!r}; "
                      f"assert not Path(daemon_server.__file__).resolve().is_relative_to(Path({str(workspace)!r})); "
                  )
              subprocess.run([str(interpreter), "-I", "-c", inspection], cwd=outside, env=env, check=True)

          harness = workspace / "spl" / "integration_tests" / "release_candidate_packages.py"
          # The harness copies workers outside the checkout, strips environment
          # overrides, creates loopback-only registry state and synthetic keys,
          # and audits anonymous consumers for author/shared-state reads.
          subprocess.run([
              str(interpreters["author"]), "-I", str(harness),
              "--root", str(scratch / "evidence"), "--version", version,
              "--author-python", str(interpreters["author"]),
              "--consumer-python", str(interpreters["matching"]),
              "--consumer-python", str(interpreters["alternate"]),
          ], cwd=outside, env={**clean_env, "HOME": str(scratch / "homes" / "author")}, check=True, timeout=600)
          summary = json.loads((scratch / "evidence" / "summary.json").read_text())
          if summary.get("status") != "passed" or len(summary.get("consumers", [])) != 2:
              raise SystemExit("real installed acceptance did not complete both consumers")
          observed = {(c["versions"]["numpy"], c["versions"]["pandas"]) for c in summary["consumers"]}
          if observed != {("2.3.5", "2.2.3"), ("2.5.4", "3.0.6")}:
              raise SystemExit("real installed acceptance dependency matrix mismatch")
          print("Real loopback author/registry/two-consumer acceptance passed against exact built wheels")
          # Deliberately keep homes, private signing keys, registry state and
          # complete harness output on this ephemeral runner; never upload them.
          PY

      # The private server wheel stays on this runner. Its digest is retained
      # in the component manifest; public transfer artifacts exclude its bytes.
      - name: Create the reviewed public artifact checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("release-workspace/artifacts")
          console_archives = list(root.glob("splime-console-*.tar.gz"))
          if len(console_archives) != 1:
              raise SystemExit("reviewed release must contain exactly one Console archive")
          included = [
              root / "source-release-manifest.json",
              *sorted((root / "python").glob("*")),
              console_archives[0],
              *sorted(path for path in (root / "console").rglob("*") if path.is_file()),
          ]
          if len(included) != len(set(included)) or not all(path.is_file() for path in included):
              raise SystemExit("reviewed release artifact allowlist is incomplete")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}"
              for path in sorted(included)
          ]
          (root / "release-artifact-bom.sha256").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload reviewed external BOM and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-built-bom-and-artifacts
          path: |
            release-workspace/artifacts/source-release-manifest.json
            release-workspace/artifacts/release-manifest.json
            release-workspace/artifacts/release-artifact-bom.sha256
            release-workspace/artifacts/python/*
            release-workspace/artifacts/console/**
            release-workspace/artifacts/splime-console-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Install exact built wheel (${{ matrix.os }})
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download reviewed external BOM and artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-built-bom-and-artifacts
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify artifact inventory and select the exact wheel
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts")
          for line in (root / "release-artifact-bom.sha256").read_text(encoding="utf-8").splitlines():
              expected, relative = line.split("  ", 1)
              path = root / relative
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"reviewed release artifact mismatch: {relative}")
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("evidence", {}).get("state") != "built":
              raise SystemExit("install test requires verified built evidence")
          wheels = [
              Path(artifact["path"]).relative_to("artifacts")
              for artifact in manifest["python"]["artifacts"]
              if artifact["filename"].endswith(".whl")
          ]
          if len(wheels) != 1:
              raise SystemExit("built BOM must contain exactly one wheel")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"RELEASE_WHEEL=artifacts/{wheels[0].as_posix()}\n")
          PY

      - name: Install and inspect the exact built wheel
        shell: bash
        run: |
          python -m venv release-smoke
          if [ -x release-smoke/Scripts/python.exe ]; then
            PYTHON=release-smoke/Scripts/python.exe
          else
            PYTHON=release-smoke/bin/python
          fi
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install "${RELEASE_WHEEL}"
          "$PYTHON" -c "from spl import SPLClient; print(SPLClient)"
          "$PYTHON" -m spl.daemon --version

  publish-testpypi:
    name: Publish exact built artifacts to TestPyPI
    needs:
      - install-test
    runs-on: ubuntu-latest
    if: inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/splime/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download reviewed external BOM and artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-built-bom-and-artifacts
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require the verified built BOM
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts")
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("evidence", {}).get("state") != "built":
              raise SystemExit("refusing to publish without built external evidence")
          expected = {}
          for artifact in manifest["python"]["artifacts"]:
              relative = Path(artifact["path"]).relative_to("artifacts")
              path = root / relative
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if digest != artifact["sha256"]:
                  raise SystemExit(f"Python artifact does not match built BOM: {relative}")
              expected[path.name] = artifact["sha256"]
          actual = {path.name for path in (root / "python").iterdir() if path.is_file()}
          if actual != set(expected):
              raise SystemExit("refusing to publish an unexpected Python artifact set")
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: artifacts/python/

  publish-pypi:
    name: Publish exact built artifacts to PyPI
    needs:
      - install-test
    runs-on: ubuntu-latest
    if: inputs.target == 'pypi'
    environment:
      name: pypi
      url: https://pypi.org/project/splime/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download reviewed external BOM and artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-built-bom-and-artifacts
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require the verified built BOM
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts")
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("evidence", {}).get("state") != "built":
              raise SystemExit("refusing to publish without built external evidence")
          expected = {}
          for artifact in manifest["python"]["artifacts"]:
              relative = Path(artifact["path"]).relative_to("artifacts")
              path = root / relative
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if digest != artifact["sha256"]:
                  raise SystemExit(f"Python artifact does not match built BOM: {relative}")
              expected[path.name] = artifact["sha256"]
          actual = {path.name for path in (root / "python").iterdir() if path.is_file()}
          if actual != set(expected):
              raise SystemExit("refusing to publish an unexpected Python artifact set")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/

      - name: Observe exact PyPI publication handoff
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path
          import time
          import urllib.parse
          import urllib.request

          root = Path("artifacts")
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          expected = {
              artifact["filename"]: artifact["sha256"]
              for artifact in manifest["python"]["artifacts"]
          }
          metadata_url = f"https://pypi.org/pypi/splime/{manifest['version']}/json"
          project = None
          failure = "PyPI metadata did not become complete"
          for attempt in range(12):
              try:
                  request = urllib.request.Request(
                      metadata_url,
                      headers={"User-Agent": "splime-release-workflow/1"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      candidate = json.loads(response.read())
                  observed = {
                      item["filename"]: item
                      for item in candidate.get("urls", [])
                  }
                  if set(observed) != set(expected):
                      failure = "PyPI filename set does not match the built BOM"
                  elif all(
                      observed[name].get("digests", {}).get("sha256") == digest
                      for name, digest in expected.items()
                  ):
                      project = observed
                      break
                  else:
                      failure = "PyPI hashes do not match the built BOM"
              except Exception as exc:
                  failure = f"PyPI observation failed: {exc}"
              if attempt != 11:
                  time.sleep(5)
          if project is None:
              raise SystemExit(failure)

          artifacts = []
          for filename in sorted(expected):
              item = project[filename]
              url = item.get("url")
              parsed = urllib.parse.urlparse(url)
              if (
                  parsed.scheme != "https"
                  or parsed.hostname is None
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.fragment
                  or Path(parsed.path).name != filename
              ):
                  raise SystemExit(f"PyPI returned an unsafe artifact URL for {filename}")
              with urllib.request.urlopen(
                  urllib.request.Request(
                      url,
                      headers={"User-Agent": "splime-release-workflow/1"},
                  ),
                  timeout=30,
              ) as response:
                  payload = response.read()
              if hashlib.sha256(payload).hexdigest() != expected[filename]:
                  raise SystemExit(f"PyPI bytes do not match the built BOM for {filename}")
              artifacts.append(
                  {
                      "filename": filename,
                      "url": url,
                      "sha256": expected[filename],
                  }
              )

          handoff = {
              "schema_version": 1,
              "release_id": manifest["release_id"],
              "index": "pypi",
              "metadata_url": metadata_url,
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "artifacts": artifacts,
          }
          (root / "pypi-publication-evidence.json").write_text(
              json.dumps(handoff, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload observed PyPI publication handoff
        uses: actions/upload-artifact@v4
        with:
          name: pypi-publication-evidence
          path: artifacts/pypi-publication-evidence.json
          if-no-files-found: error
          retention-days: 14
