name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Exact signed SPLime source tag to build"
        required: true
        type: string
      target:
        description: "Package index to publish to"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

env:
  RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name || github.ref_name }}
  PUBLIC_COOKBOOK_URL: https://splime.io/downloads/splime-cookbook.ipynb
  PUBLIC_COOKBOOK_SHA256: 15ae5b809223426f26b998fd3f5b6aef1bf10e9d0b6e74dfdeef2572405f368d

jobs:
  test:
    name: Verify signed source and test SPLime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the versioned release-signing public key
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-controls
          persist-credentials: false
          sparse-checkout: .github/release-signing-public-key.asc
          sparse-checkout-cone-mode: false

      - name: Check out the exact SPLime source tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify the signed source tag
        run: |
          KEY_PATH="${GITHUB_WORKSPACE}/release-controls/.github/release-signing-public-key.asc"
          test "$(gpg --batch --show-keys --with-colons "${KEY_PATH}" \
            | awk -F: '$1 == "fpr" { print $10; exit }')" \
            = "31E24377474710AF950C81C6B8C5D1937087FA85"
          gpg --batch --import "${KEY_PATH}"
          git verify-tag "${RELEASE_TAG}"

      - name: Validate the requested version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          requested = os.environ["RELEASE_TAG"]
          if requested != f"v{version}":
              raise SystemExit(f"requested tag {requested!r} does not match package version {version!r}")
          PY

      - name: Fetch and verify the reviewed public cookbook
        run: |
          curl --fail --location \
            --proto '=https' --proto-redir '=https' \
            --output "${RUNNER_TEMP}/splime-cookbook.ipynb" \
            "${PUBLIC_COOKBOOK_URL}"
          printf '%s  %s\n' \
            "${PUBLIC_COOKBOOK_SHA256}" \
            "${RUNNER_TEMP}/splime-cookbook.ipynb" \
            | sha256sum --check --strict -
          echo "SPL_RELEASE_COOKBOOK_PATH=${RUNNER_TEMP}/splime-cookbook.ipynb" \
            >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Ruff lint
        run: ruff check

      - name: Check Ruff formatting
        run: ruff format --check

      - name: Run mypy
        run: mypy --python-version 3.13 src

      - name: Run package tests
        run: >-
          python -m pytest -m "not smoke" -q
          --ignore=tests/core/test_release_chain.py
          --ignore=tests/core/test_release_controls.py
          --ignore=tests/core/test_release_workflows.py

  build:
    name: Build reproducible wheel and sdist
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the versioned release-signing public key
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-controls
          persist-credentials: false
          sparse-checkout: .github/release-signing-public-key.asc
          sparse-checkout-cone-mode: false

      - name: Check out the exact SPLime source tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify the signed source tag
        run: |
          KEY_PATH="${GITHUB_WORKSPACE}/release-controls/.github/release-signing-public-key.asc"
          test "$(gpg --batch --show-keys --with-colons "${KEY_PATH}" \
            | awk -F: '$1 == "fpr" { print $10; exit }')" \
            = "31E24377474710AF950C81C6B8C5D1937087FA85"
          gpg --batch --import "${KEY_PATH}"
          git verify-tag "${RELEASE_TAG}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Build artifacts twice
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          python tools/build_release_artifacts.py \
            --out-dir "${GITHUB_WORKSPACE}/dist" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python tools/build_release_artifacts.py \
            --out-dir "${GITHUB_WORKSPACE}/dist-reproducibility" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digests(root: Path) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.iterdir())
                  if path.is_file()
              }

          first = digests(Path("../dist"))
          second = digests(Path("../dist-reproducibility"))
          if set(first) != set(second) or len(first) != 2 or first != second:
              raise SystemExit("wheel/sdist build is not reproducible")
          PY
          python -m twine check "${GITHUB_WORKSPACE}"/dist/*

      - name: Create artifact checksum inventory
        run: |
          install -d "${GITHUB_WORKSPACE}/release-evidence"
          (
            cd "${GITHUB_WORKSPACE}"
            sha256sum dist/* > release-evidence/python-artifacts.sha256
          )

      - name: Upload exact package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splime-python-release
          path: |
            dist/*
            release-evidence/python-artifacts.sha256
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Install exact wheel (${{ matrix.os }})
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download exact package artifacts
        uses: actions/download-artifact@v4
        with:
          name: splime-python-release
          path: package

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify checksums and select the wheel
        shell: bash
        run: |
          (
            cd package
            sha256sum --check --strict release-evidence/python-artifacts.sha256
          )
          WHEEL="$(find package/dist -maxdepth 1 -type f -name 'splime-*.whl' -print)"
          test -n "${WHEEL}"
          test "$(printf '%s\n' "${WHEEL}" | wc -l | tr -d ' ')" = "1"
          echo "RELEASE_WHEEL=${WHEEL}" >> "${GITHUB_ENV}"

      - name: Install and inspect the exact wheel
        shell: bash
        run: |
          python -m venv release-smoke
          if [ -x release-smoke/Scripts/python.exe ]; then
            PYTHON=release-smoke/Scripts/python.exe
          else
            PYTHON=release-smoke/bin/python
          fi
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install "${RELEASE_WHEEL}"
          "$PYTHON" -c "from spl import SPLClient; print(SPLClient)"
          "$PYTHON" -m spl.daemon --version

  publish-testpypi:
    name: Publish exact artifacts to TestPyPI
    needs:
      - install-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    environment:
      name: testpypi
      url: https://test.pypi.org/project/splime/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact package artifacts
        uses: actions/download-artifact@v4
        with:
          name: splime-python-release
          path: package

      - name: Verify exact package artifacts
        run: |
          (
            cd package
            sha256sum --check --strict release-evidence/python-artifacts.sha256
          )

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: package/dist/

  publish-pypi:
    name: Publish exact artifacts to PyPI
    needs:
      - install-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/splime/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact package artifacts
        uses: actions/download-artifact@v4
        with:
          name: splime-python-release
          path: package

      - name: Verify exact package artifacts
        run: |
          (
            cd package
            sha256sum --check --strict release-evidence/python-artifacts.sha256
          )

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package/dist/

      - name: Verify PyPI publication
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          import urllib.request

          expected = {}
          for line in Path("package/release-evidence/python-artifacts.sha256").read_text().splitlines():
              digest, relative = line.split("  ", 1)
              expected[Path(relative).name] = digest

          release_tag = os.environ["RELEASE_TAG"]
          if not release_tag.startswith("v"):
              raise SystemExit("release tag must start with v")
          metadata_url = f"https://pypi.org/pypi/splime/{release_tag[1:]}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(metadata_url, timeout=30) as response:
                      payload = json.loads(response.read())
                  observed = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload.get("urls", [])
                  }
                  if observed == expected:
                      break
              except Exception:
                  pass
              if attempt == 11:
                  raise SystemExit("PyPI did not expose the exact published artifacts")
              time.sleep(5)
          PY
