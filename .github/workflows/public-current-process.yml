name: Public current-process contract
on:
  pull_request:
    paths:
      - "src/spl/**"
      - "tests/core/test_public_current_process.py"
      - "tests/core/test_unified_result_access.py"
      - "tests/core/test_runtime_port_adapters.py"
      - "tests/fixtures/legacy_public_verifier_0_4_10.txt"
      - "pyproject.toml"
      - ".github/workflows/public-current-process.yml"
  workflow_dispatch:
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest pytest-asyncio "numpy==2.1.3" "pandas==2.2.3"
      - name: Verify native execution and platform timeout boundaries
        run: python -m pytest tests/core/test_public_current_process.py tests/core/test_unified_result_access.py tests/core/test_distribution_resolution.py tests/core/test_process_tree.py
        env:
          SPL_RUNS_HOME: ${{ runner.temp }}/spl-current-process-runs
      - name: Verify FileInput identity and replacement on each platform
        run: python -m pytest tests/core/test_runtime_port_adapters.py -k file_input
      # Timed isolated workers remain POSIX-only; the native profile above supports Windows.
      # Cross-repository fixture equality runs in the complete release workspace.
      - name: Verify legacy isolated execution on supported hosts
        if: runner.os != 'Windows'
        run: python -m pytest -k "not test_cross_repository_fixture_is_identical_and_verifiable" tests/core/test_prompt02_embedded.py
        env:
          SPL_RUNS_HOME: ${{ runner.temp }}/spl-isolated-runs
